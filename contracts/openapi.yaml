openapi: 3.1.0
info:
  title: Chat App API
  version: 0.3.0
  description: |
    REST contract for feature 001 (sign-in, devices, profile, contacts) and
    feature 002 (end-to-end encrypted messaging: keys, conversations, messages).
    The server only ever sees Signal public keys and opaque ciphertext.
    Canonical copy lives in the api repo at contracts/openapi.yaml.
servers:
  - url: http://localhost:3000/v1
security:
  - bearer: []
tags:
  - name: auth
  - name: devices
  - name: profile
  - name: contacts
  - name: keys
  - name: conversations
  - name: messages
  - name: ops

paths:
  /health:
    get:
      tags: [ops]
      operationId: health
      summary: Liveness probe for the hosting platform. Does not touch the database or Redis.
      security: []
      responses:
        '200':
          description: The process is up.
          content:
            application/json:
              schema:
                type: object
                required: [status]
                properties:
                  status: { type: string, const: ok }

  /auth/request-code:
    post:
      tags: [auth]
      operationId: requestCode
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RequestCodeBody' }
            example: { phone: '+255712345678' }
      responses:
        '202':
          description: Code sent if the number is valid. Same response whether or not an account exists.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/RequestCodeResponse' }
              example: { expiresIn: 300, resendAfter: 60 }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/verify:
    post:
      tags: [auth]
      operationId: verifyCode
      security: []
      description: |
        Verifies the code and signs the device in. `deviceType: android` creates the account if
        needed and revokes any other Android device. `deviceType: web` requires an existing
        account and evicts the least recently active web device if 4 are already signed in.
        For web, the refresh token is set as an HttpOnly cookie and omitted from the body.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/VerifyBody' }
            example: { phone: '+255712345678', code: '123456', deviceType: android, deviceName: 'Pixel 8' }
      responses:
        '200':
          description: Signed in.
          headers:
            Set-Cookie:
              description: Web only. `rt=<refresh>; HttpOnly; Secure; SameSite=Strict; Path=/v1/auth`
              schema: { type: string }
          content:
            application/json:
              schema: { $ref: '#/components/schemas/AuthResult' }
              example:
                accessToken: eyJhbGciOiJIUzI1NiJ9.e30.sig
                expiresIn: 900
                refreshToken: 3q2-7wAAAAA
                isNewAccount: true
                device: { id: 0192f8a0-0000-7000-8000-000000000001, type: android, name: Pixel 8, createdAt: '2026-11-17T10:00:00Z', lastActiveAt: '2026-11-17T10:00:00Z', current: true }
                user: { id: 0192f8a0-0000-7000-8000-000000000002, phone: '+255712345678', displayName: null, about: 'Hey there! I am using Chat App.', avatarUrl: null, profileComplete: false }
        '400': { $ref: '#/components/responses/Error' }
        '401':
          description: Wrong, expired or used code (`INVALID_CODE`, `CODE_EXPIRED`, `TOO_MANY_ATTEMPTS`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '404':
          description: Web sign-in for a number with no account (`ACCOUNT_NOT_FOUND`). Only returned after a correct code.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /auth/refresh:
    post:
      tags: [auth]
      operationId: refresh
      security: []
      description: Rotates the refresh token. Android sends it in the body; web sends the `rt` cookie.
      requestBody:
        required: false
        content:
          application/json:
            schema: { $ref: '#/components/schemas/RefreshBody' }
      responses:
        '200':
          description: New token pair (web gets a new cookie and no `refreshToken` field).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/TokenPair' }
              example: { accessToken: eyJhbGciOiJIUzI1NiJ9.e30.sig, expiresIn: 900, refreshToken: 3q2-7wAAAAB }
        '401':
          description: Refresh token invalid, expired, reused, or device revoked (`SESSION_REVOKED`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }

  /auth/sign-out:
    post:
      tags: [auth]
      operationId: signOut
      description: Revokes the current device.
      responses:
        '204': { description: Signed out. }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices:
    get:
      tags: [devices]
      operationId: listDevices
      responses:
        '200':
          description: Active devices of the current user.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Device' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /devices/{deviceId}:
    delete:
      tags: [devices]
      operationId: revokeDevice
      parameters:
        - { name: deviceId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Device signed out; it receives `device:revoked`. }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }

  /me:
    get:
      tags: [profile]
      operationId: getMe
      responses:
        '200':
          description: Current user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    patch:
      tags: [profile]
      operationId: updateMe
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UpdateProfileBody' }
            example: { displayName: Frank, about: Available }
      responses:
        '200':
          description: Updated user.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /me/avatar:
    put:
      tags: [profile]
      operationId: uploadAvatar
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required: [file]
              properties:
                file: { type: string, format: binary, description: 'JPEG, PNG or WebP, max 5 MB' }
      responses:
        '200':
          description: Updated user with new avatar URLs.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }
        '400': { $ref: '#/components/responses/Error' }
        '413': { $ref: '#/components/responses/Error' }
        '415': { $ref: '#/components/responses/Error' }
    delete:
      tags: [profile]
      operationId: deleteAvatar
      responses:
        '200':
          description: Updated user without avatar.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Me' }

  /avatars/{key}:
    get:
      tags: [profile]
      operationId: getAvatar
      security: []
      parameters:
        - { name: key, in: path, required: true, schema: { type: string } }
      responses:
        '200':
          description: 'WebP image. Served with Cache-Control public, max-age=31536000, immutable.'
          content:
            image/webp:
              schema: { type: string, format: binary }
        '404': { $ref: '#/components/responses/Error' }

  /contacts/discover:
    post:
      tags: [contacts]
      operationId: discoverContacts
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/DiscoverBody' }
            example: { phones: ['+255712345678', '+255700000000'] }
      responses:
        '200':
          description: Accounts among the submitted numbers. Unmatched numbers are not stored.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicUser' }
        '400': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /contacts:
    get:
      tags: [contacts]
      operationId: listContacts
      responses:
        '200':
          description: Contacts with accounts, sorted by display name.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicUser' }

  /users:
    get:
      tags: [contacts]
      operationId: getUsers
      description: |
        Public profiles by id, used to name group members who aren't contacts.
        Only users the caller may see are returned: the caller, their contacts and anyone
        who shares a conversation with them. Other ids are left out without an error.
      parameters:
        - name: id
          in: query
          required: true
          description: User ids (repeatable, 1-64).
          style: form
          explode: true
          schema:
            type: array
            minItems: 1
            maxItems: 64
            items: { type: string, format: uuid }
      responses:
        '200':
          description: The visible users among the requested ids, in no particular order.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/PublicUser' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /users/lookup:
    get:
      tags: [contacts]
      operationId: lookupUser
      parameters:
        - { name: phone, in: query, required: true, schema: { $ref: '#/components/schemas/Phone' } }
      responses:
        '200':
          description: The account for this number.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/PublicUser' }
        '404':
          description: Number not on the app (`USER_NOT_FOUND`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /keys:
    put:
      tags: [keys]
      operationId: uploadKeys
      description: |
        Publish this device's Signal public keys. The first upload must include
        `signedPreKey` (otherwise 400 `KEYS_NOT_UPLOADED`); later calls may only top up
        `preKeys` or rotate `signedPreKey`. Sending a different `identityKey` replaces
        all of the device's keys.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/UploadKeysBody' }
      responses:
        '204': { description: Keys stored. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /keys/count:
    get:
      tags: [keys]
      operationId: getKeyCount
      responses:
        '200':
          description: Unused one-time prekeys left for this device.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/KeyCount' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /users/{userId}/keys:
    get:
      tags: [keys]
      operationId: getUserKeys
      description: |
        One prekey bundle per active device of the user that has uploaded keys.
        Each call consumes one one-time prekey per returned device (`preKey` is null
        when none are left). When `userId` is the caller, the calling device is left out.
      parameters:
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
        - name: deviceId
          in: query
          required: false
          description: Only return bundles for these devices (repeatable).
          style: form
          explode: true
          schema: { type: array, maxItems: 5, items: { type: string, format: uuid } }
      responses:
        '200':
          description: Bundles.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/UserKeys' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /conversations:
    get:
      tags: [conversations]
      operationId: listConversations
      responses:
        '200':
          description: Conversations the caller is a member of, newest first.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
    post:
      tags: [conversations]
      operationId: createConversation
      description: |
        `direct` is idempotent: returns the existing conversation with that peer (200)
        or creates it (201). `group` always creates a new group with the caller as admin.
        Group names and other metadata are never sent here; they travel end-to-end
        encrypted inside messages.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/CreateConversationBody' }
      responses:
        '200':
          description: Existing direct conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '201':
          description: Created. Other members receive `conversation:updated`.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }

  /conversations/{conversationId}:
    get:
      tags: [conversations]
      operationId: getConversation
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      responses:
        '200':
          description: The conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '404': { $ref: '#/components/responses/Error' }

  /conversations/{conversationId}/members:
    post:
      tags: [conversations]
      operationId: addMembers
      description: Group admins only. All members (old and new) receive `conversation:updated`.
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AddMembersBody' }
      responses:
        '200':
          description: Updated conversation.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/Conversation' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /conversations/{conversationId}/members/{userId}:
    delete:
      tags: [conversations]
      operationId: removeMember
      description: |
        Groups only. Admins may remove anyone; any member may remove themselves (leave).
        If the last admin leaves, the longest-standing member becomes admin.
        Remaining members get `conversation:updated`; the removed user gets
        `conversation:updated` with `removed: true`.
      parameters:
        - { $ref: '#/components/parameters/ConversationId' }
        - { name: userId, in: path, required: true, schema: { type: string, format: uuid } }
      responses:
        '204': { description: Removed. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }

  /messages:
    post:
      tags: [messages]
      operationId: sendMessage
      description: |
        Deliver one ciphertext per recipient device. `envelopes` must cover exactly the
        active, key-holding devices of every other member plus the sender's own other
        devices. Otherwise nothing is stored and the server answers 409 `DEVICE_MISMATCH`
        with `details` shaped as `DeviceMismatch`. Each stored envelope is pushed as
        `envelope:new` to its device.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/SendMessageBody' }
      responses:
        '200':
          description: Stored and pushed to online devices.
          content:
            application/json:
              schema: { $ref: '#/components/schemas/SendMessageResult' }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }
        '403': { $ref: '#/components/responses/Error' }
        '404': { $ref: '#/components/responses/Error' }
        '409':
          description: Device list out of date (`DEVICE_MISMATCH`).
          content:
            application/json:
              schema: { $ref: '#/components/schemas/DeviceMismatchError' }
        '413': { $ref: '#/components/responses/Error' }
        '429': { $ref: '#/components/responses/RateLimited' }

  /envelopes:
    get:
      tags: [messages]
      operationId: listEnvelopes
      description: Envelopes waiting for this device, oldest first.
      parameters:
        - { name: limit, in: query, required: false, schema: { type: integer, minimum: 1, maximum: 200, default: 100 } }
      responses:
        '200':
          description: Pending envelopes.
          content:
            application/json:
              schema:
                type: array
                items: { $ref: '#/components/schemas/Envelope' }
        '401': { $ref: '#/components/responses/Unauthorized' }

  /envelopes/ack:
    post:
      tags: [messages]
      operationId: ackEnvelopes
      description: Delete envelopes this device has processed. Ids that are unknown or belong to another device are ignored.
      requestBody:
        required: true
        content:
          application/json:
            schema: { $ref: '#/components/schemas/AckBody' }
      responses:
        '204': { description: Deleted. }
        '400': { $ref: '#/components/responses/Error' }
        '401': { $ref: '#/components/responses/Unauthorized' }

components:
  securitySchemes:
    bearer:
      type: http
      scheme: bearer
      bearerFormat: JWT

  parameters:
    ConversationId:
      name: conversationId
      in: path
      required: true
      schema: { type: string, format: uuid }

  responses:
    Error:
      description: Error.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    Unauthorized:
      description: Missing/expired access token or revoked device.
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }
    RateLimited:
      description: Too many requests.
      headers:
        Retry-After: { schema: { type: integer }, description: Seconds to wait. }
      content:
        application/json:
          schema: { $ref: '#/components/schemas/Error' }

  schemas:
    Phone:
      type: string
      pattern: '^\+[1-9]\d{6,14}$'
      description: E.164
    DeviceType:
      type: string
      enum: [android, web]
    RequestCodeBody:
      type: object
      required: [phone]
      additionalProperties: false
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
    RequestCodeResponse:
      type: object
      required: [expiresIn, resendAfter]
      properties:
        expiresIn: { type: integer, description: seconds }
        resendAfter: { type: integer, description: seconds }
    VerifyBody:
      type: object
      required: [phone, code, deviceType, deviceName]
      additionalProperties: false
      properties:
        phone: { $ref: '#/components/schemas/Phone' }
        code: { type: string, pattern: '^\d{6}$' }
        deviceType: { $ref: '#/components/schemas/DeviceType' }
        deviceName: { type: string, minLength: 1, maxLength: 64 }
    RefreshBody:
      type: object
      additionalProperties: false
      properties:
        refreshToken: { type: string, description: Android only }
    TokenPair:
      type: object
      required: [accessToken, expiresIn]
      properties:
        accessToken: { type: string }
        expiresIn: { type: integer, description: seconds }
        refreshToken: { type: string, description: Omitted for web (cookie). }
    AuthResult:
      allOf:
        - $ref: '#/components/schemas/TokenPair'
        - type: object
          required: [isNewAccount, device, user]
          properties:
            isNewAccount: { type: boolean }
            device: { $ref: '#/components/schemas/Device' }
            user: { $ref: '#/components/schemas/Me' }
    Device:
      type: object
      required: [id, type, name, createdAt, lastActiveAt, current]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/DeviceType' }
        name: { type: string }
        createdAt: { type: string, format: date-time }
        lastActiveAt: { type: string, format: date-time }
        current: { type: boolean, description: True for the device making the request. }
    PublicUser:
      type: object
      required: [id, phone, displayName, about, avatarUrl]
      properties:
        id: { type: string, format: uuid }
        phone: { $ref: '#/components/schemas/Phone' }
        displayName: { type: [string, 'null'] }
        about: { type: string }
        avatarUrl: { type: [string, 'null'], format: uri }
        avatarThumbUrl: { type: [string, 'null'], format: uri }
    Me:
      allOf:
        - $ref: '#/components/schemas/PublicUser'
        - type: object
          required: [profileComplete]
          properties:
            profileComplete: { type: boolean }
    UpdateProfileBody:
      type: object
      additionalProperties: false
      minProperties: 1
      properties:
        displayName: { type: string, minLength: 1, maxLength: 25 }
        about: { type: string, maxLength: 140 }
    DiscoverBody:
      type: object
      required: [phones]
      additionalProperties: false
      properties:
        phones:
          type: array
          minItems: 1
          maxItems: 1000
          items: { $ref: '#/components/schemas/Phone' }
    Error:
      type: object
      required: [code, message]
      properties:
        code:
          type: string
          enum:
            - VALIDATION_FAILED
            - INVALID_PHONE
            - INVALID_CODE
            - CODE_EXPIRED
            - TOO_MANY_ATTEMPTS
            - ACCOUNT_NOT_FOUND
            - USER_NOT_FOUND
            - NOT_FOUND
            - DEVICE_NOT_FOUND
            - SESSION_REVOKED
            - UNAUTHORIZED
            - RATE_LIMITED
            - FILE_TOO_LARGE
            - UNSUPPORTED_MEDIA_TYPE
            - CONVERSATION_NOT_FOUND
            - NOT_A_MEMBER
            - FORBIDDEN
            - DEVICE_MISMATCH
            - KEYS_NOT_UPLOADED
            - GROUP_TOO_LARGE
            - PAYLOAD_TOO_LARGE
            - INTERNAL
        message: { type: string }
        details: { type: object, additionalProperties: true }
    Base64:
      type: string
      pattern: '^[A-Za-z0-9+/]*={0,2}$'
      contentEncoding: base64
    PublicPreKey:
      type: object
      required: [keyId, publicKey]
      additionalProperties: false
      properties:
        keyId: { type: integer, minimum: 0, maximum: 16777215 }
        publicKey:
          allOf: [{ $ref: '#/components/schemas/Base64' }]
          description: 33-byte Curve25519 public key (0x05 prefix).
          minLength: 44
          maxLength: 44
    SignedPreKey:
      type: object
      required: [keyId, publicKey, signature]
      additionalProperties: false
      properties:
        keyId: { type: integer, minimum: 0, maximum: 16777215 }
        publicKey:
          allOf: [{ $ref: '#/components/schemas/Base64' }]
          minLength: 44
          maxLength: 44
        signature:
          allOf: [{ $ref: '#/components/schemas/Base64' }]
          description: 64-byte XEdDSA signature of publicKey by the identity key.
          minLength: 88
          maxLength: 88
    UploadKeysBody:
      type: object
      required: [registrationId, identityKey, preKeys]
      additionalProperties: false
      properties:
        registrationId: { type: integer, minimum: 1, maximum: 16380 }
        identityKey:
          allOf: [{ $ref: '#/components/schemas/Base64' }]
          minLength: 44
          maxLength: 44
        signedPreKey: { $ref: '#/components/schemas/SignedPreKey' }
        preKeys:
          type: array
          maxItems: 100
          items: { $ref: '#/components/schemas/PublicPreKey' }
    KeyCount:
      type: object
      required: [count]
      properties:
        count: { type: integer, minimum: 0 }
    DeviceBundle:
      type: object
      required: [deviceId, registrationId, identityKey, signedPreKey, preKey]
      properties:
        deviceId: { type: string, format: uuid }
        registrationId: { type: integer }
        identityKey: { $ref: '#/components/schemas/Base64' }
        signedPreKey: { $ref: '#/components/schemas/SignedPreKey' }
        preKey:
          oneOf:
            - { $ref: '#/components/schemas/PublicPreKey' }
            - { type: 'null' }
    UserKeys:
      type: object
      required: [userId, devices]
      properties:
        userId: { type: string, format: uuid }
        devices:
          type: array
          items: { $ref: '#/components/schemas/DeviceBundle' }
    ConversationType:
      type: string
      enum: [direct, group]
    MemberRole:
      type: string
      enum: [admin, member]
    ConversationMember:
      type: object
      required: [userId, role, joinedAt]
      properties:
        userId: { type: string, format: uuid }
        role: { $ref: '#/components/schemas/MemberRole' }
        joinedAt: { type: string, format: date-time }
    Conversation:
      type: object
      required: [id, type, createdAt, members]
      properties:
        id: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/ConversationType' }
        createdAt: { type: string, format: date-time }
        members:
          type: array
          items: { $ref: '#/components/schemas/ConversationMember' }
    CreateDirectConversationBody:
      type: object
      required: [type, peerId]
      additionalProperties: false
      properties:
        type: { const: direct }
        peerId: { type: string, format: uuid }
    CreateGroupConversationBody:
      type: object
      required: [type, memberIds]
      additionalProperties: false
      properties:
        type: { const: group }
        memberIds:
          type: array
          minItems: 1
          maxItems: 63
          uniqueItems: true
          description: Other members; the caller is added as admin. Groups hold at most 64 members.
          items: { type: string, format: uuid }
    CreateConversationBody:
      oneOf:
        - { $ref: '#/components/schemas/CreateDirectConversationBody' }
        - { $ref: '#/components/schemas/CreateGroupConversationBody' }
      discriminator:
        propertyName: type
        mapping:
          direct: '#/components/schemas/CreateDirectConversationBody'
          group: '#/components/schemas/CreateGroupConversationBody'
    AddMembersBody:
      type: object
      required: [userIds]
      additionalProperties: false
      properties:
        userIds:
          type: array
          minItems: 1
          maxItems: 63
          uniqueItems: true
          items: { type: string, format: uuid }
    EnvelopeType:
      type: string
      enum: [prekey, whisper]
      description: prekey = PreKeySignalMessage (starts a session), whisper = SignalMessage.
    OutgoingEnvelope:
      type: object
      required: [deviceId, type, ciphertext]
      additionalProperties: false
      properties:
        deviceId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/EnvelopeType' }
        ciphertext:
          allOf: [{ $ref: '#/components/schemas/Base64' }]
          description: Opaque Signal message, at most 64 KiB before base64.
          minLength: 4
          maxLength: 87384
    SendMessageBody:
      type: object
      required: [conversationId, envelopes]
      additionalProperties: false
      properties:
        conversationId: { type: string, format: uuid }
        envelopes:
          type: array
          maxItems: 320
          description: Empty only when no other device needs a copy (for example, a note to self with one device).
          items: { $ref: '#/components/schemas/OutgoingEnvelope' }
    SendMessageResult:
      type: object
      required: [serverTimestamp]
      properties:
        serverTimestamp: { type: string, format: date-time }
    DeviceRef:
      type: object
      required: [userId, deviceId]
      properties:
        userId: { type: string, format: uuid }
        deviceId: { type: string, format: uuid }
    DeviceMismatch:
      type: object
      required: [missingDevices, staleDevices]
      properties:
        missingDevices:
          type: array
          description: Active devices with no envelope; fetch their bundles and resend.
          items: { $ref: '#/components/schemas/DeviceRef' }
        staleDevices:
          type: array
          description: Envelopes addressed to devices that are gone or not in the conversation; drop those sessions.
          items: { $ref: '#/components/schemas/DeviceRef' }
    DeviceMismatchError:
      allOf:
        - $ref: '#/components/schemas/Error'
        - type: object
          required: [details]
          properties:
            code: { const: DEVICE_MISMATCH }
            details: { $ref: '#/components/schemas/DeviceMismatch' }
    Envelope:
      type: object
      required: [id, conversationId, senderUserId, senderDeviceId, type, ciphertext, serverTimestamp]
      properties:
        id: { type: string, format: uuid }
        conversationId: { type: string, format: uuid }
        senderUserId: { type: string, format: uuid }
        senderDeviceId: { type: string, format: uuid }
        type: { $ref: '#/components/schemas/EnvelopeType' }
        ciphertext: { $ref: '#/components/schemas/Base64' }
        serverTimestamp: { type: string, format: date-time }
    AckBody:
      type: object
      required: [ids]
      additionalProperties: false
      properties:
        ids:
          type: array
          minItems: 1
          maxItems: 500
          items: { type: string, format: uuid }
